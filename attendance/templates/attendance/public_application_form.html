<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application | {{ invitation.organization.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f8fafc; color: #0f172a; }
        .public-shell { max-width: 880px; margin: 40px auto; padding: 0 16px; }
        .card { border: 1px solid rgba(148, 163, 184, 0.35); border-radius: 8px; box-shadow: 0 14px 40px rgba(15, 23, 42, 0.08); }
        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
        .wide-field { grid-column: 1 / -1; }
        @media (max-width: 767.98px) { .form-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main class="public-shell">
        <div class="card">
            <div class="card-header bg-white p-4">
                <div class="text-muted small text-uppercase fw-semibold">{{ invitation.organization.name }}</div>
                <h4 class="mb-0">Submit Application</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
                    <div class="form-grid">
                        {% for field in form %}
                        <div class="{% if field.name == 'cover_note' %}wide-field{% endif %}">
                            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
                        </div>
                        {% endfor %}
                    </div>
                    <div class="d-flex justify-content-end mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-send me-1"></i> Submit Application
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
